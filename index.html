<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>双随机高效专注计时器 · Gap Effect &amp; Ultradian Rhythm</title>
  <style>
    :root {
      --bg-void: #0b0d10;
      --bg-canvas: #101318;
      --bg-panel: rgba(20, 24, 30, 0.74);
      --bg-control: rgba(30, 35, 43, 0.72);
      --bg-control-hover: rgba(41, 48, 59, 0.88);
      --border-hairline: rgba(214, 224, 238, 0.085);
      --border-strong: rgba(214, 224, 238, 0.17);

      --text-primary: #e4e8ee;
      --text-secondary: #a1aab7;
      --text-muted: #6f7886;

      --accent: #84b09d;
      --accent-glow: rgba(132, 176, 157, 0.22);
      --accent-soft: rgba(132, 176, 157, 0.13);
      --accent-border: rgba(132, 176, 157, 0.42);
      --accent-text: #cde6da;

      --rest-accent: #d4a674;
      --rest-glow: rgba(212, 166, 116, 0.24);
      --rest-soft: rgba(212, 166, 116, 0.14);
      --rest-border: rgba(212, 166, 116, 0.48);

      --break-accent: #90a6c7;
      --break-glow: rgba(144, 166, 199, 0.22);
      --break-soft: rgba(144, 166, 199, 0.14);
      --break-border: rgba(144, 166, 199, 0.42);

      --font-serif: "Songti SC", "Noto Serif SC", "STSong", Georgia, "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 36px;
      overflow-x: hidden;
      background:
        radial-gradient(65% 55% at 22% 18%, rgba(132, 176, 157, 0.085) 0%, rgba(11, 13, 16, 0) 70%),
        radial-gradient(50% 45% at 85% 85%, rgba(144, 166, 199, 0.05) 0%, rgba(11, 13, 16, 0) 70%),
        var(--bg-void);
      transition: background 0.9s var(--ease-out);
    }

    body[data-phase="micro_rest"] {
      background:
        radial-gradient(70% 60% at 35% 30%, rgba(212, 166, 116, 0.13) 0%, rgba(15, 12, 10, 0) 72%),
        radial-gradient(50% 45% at 80% 80%, rgba(212, 166, 116, 0.05) 0%, rgba(15, 12, 10, 0) 70%),
        #110e0b;
    }

    body[data-phase="macro_break"] {
      background:
        radial-gradient(65% 55% at 30% 25%, rgba(144, 166, 199, 0.11) 0%, rgba(10, 13, 18, 0) 72%),
        #0b0e14;
    }

    /* Subtle organic surface grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .app-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      background: var(--bg-panel);
      border: 1px solid var(--border-hairline);
      border-radius: 26px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.045);
      overflow: hidden;
      transition: border-color 0.7s var(--ease-out);
    }

    body[data-phase="micro_rest"] .app-frame {
      border-color: rgba(212, 166, 116, 0.25);
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.24rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .phase-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-hairline);
      white-space: nowrap;
      transition: all 0.45s var(--ease-out);
    }

    .phase-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background-color 0.45s ease, box-shadow 0.45s ease;
    }

    body[data-phase="focus"] .phase-pill {
      color: var(--accent-text);
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    body[data-phase="focus"] .phase-dot {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    body[data-phase="micro_rest"] .phase-pill {
      color: #f0d0ab;
      background: var(--rest-soft);
      border-color: var(--rest-border);
    }

    body[data-phase="micro_rest"] .phase-dot {
      background: var(--rest-accent);
      box-shadow: 0 0 12px var(--rest-accent);
    }

    body[data-phase="macro_break"] .phase-pill {
      color: #ceddf2;
      background: var(--break-soft);
      border-color: var(--break-border);
    }

    body[data-phase="macro_break"] .phase-dot {
      background: var(--break-accent);
    }

    /* Main Asymmetric Split Layout */
    .workspace {
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      min-height: 520px;
    }

    /* Left: Chronometer Sanctuary */
    .sanctuary {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 34px 30px 30px;
      gap: 24px;
      border-right: 1px solid var(--border-hairline);
      position: relative;
    }

    .dial-stage {
      position: relative;
      width: 296px;
      height: 296px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Slow ambient breathing aura */
    .aura-ring {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(132, 176, 157, 0) 68%);
      opacity: 0.2;
      transform: scale(0.92);
      pointer-events: none;
      transition: opacity 0.8s ease, background 0.8s ease;
    }

    body[data-phase="focus"] .aura-ring {
      opacity: 0.85;
      animation: sereneBreath 9s ease-in-out infinite;
    }

    body[data-phase="micro_rest"] .aura-ring {
      opacity: 1;
      background: radial-gradient(circle, var(--rest-glow) 0%, rgba(212, 166, 116, 0) 70%);
      animation: restGlow 4.5s ease-in-out infinite;
    }

    @keyframes sereneBreath {
      0%, 100% { transform: scale(0.89); opacity: 0.35; }
      50% { transform: scale(1.04); opacity: 0.85; }
    }

    @keyframes restGlow {
      0%, 100% { transform: scale(0.92); opacity: 0.55; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .aura-ring, .micro-dot {
        animation: none !important;
      }
    }

    .dial-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .dial-ticks line {
      stroke: rgba(214, 224, 238, 0.14);
      stroke-linecap: round;
    }

    .dial-ticks line.major {
      stroke: rgba(214, 224, 238, 0.28);
    }

    .ring-track {
      fill: none;
      stroke: rgba(214, 224, 238, 0.08);
      stroke-width: 3.5;
    }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 140px 140px;
      transition: stroke-dashoffset 0.5s linear, stroke 0.6s ease;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    body[data-phase="micro_rest"] .ring-progress {
      stroke: var(--rest-accent);
      filter: drop-shadow(0 0 10px var(--rest-glow));
    }

    body[data-phase="macro_break"] .ring-progress {
      stroke: var(--break-accent);
      filter: drop-shadow(0 0 8px var(--break-glow));
    }

    .dial-center {
      position: absolute;
      inset: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 7px;
    }

    .time-display {
      font-family: var(--font-mono);
      font-size: 3.5rem;
      font-weight: 300;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      line-height: 1;
      transition: color 0.5s ease;
    }

    body[data-phase="micro_rest"] .time-display {
      color: var(--rest-accent);
      font-size: 4rem;
    }

    .time-caption {
      font-family: var(--font-serif);
      font-size: 0.92rem;
      color: var(--text-secondary);
      max-width: 190px;
      line-height: 1.4;
    }

    .micro-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
      max-width: 184px;
    }

    .micro-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      opacity: 0.3;
      transition: opacity 0.4s ease;
    }

    body[data-phase="focus"] .micro-dot {
      opacity: 0.9;
      animation: pulseDot 5.5s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.95; }
    }

    /* Macro Complete / Break Panel */
    .break-panel {
      display: none;
      width: 100%;
      max-width: 420px;
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--break-soft);
      border: 1px solid var(--break-border);
      text-align: center;
      flex-direction: column;
      gap: 10px;
    }

    .break-panel.visible {
      display: flex;
    }

    .break-panel h2 {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .break-panel p {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .break-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    /* Controls */
    .controls-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-control);
      color: var(--text-primary);
      font-size: 0.86rem;
      font-weight: 500;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.12s ease;
    }

    button svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    button:hover:not(:disabled) {
      background: var(--bg-control-hover);
      border-color: var(--border-strong);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      min-width: 138px;
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: rgba(132, 176, 157, 0.22);
      border-color: rgba(132, 176, 157, 0.65);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .acoustic-readout {
      font-size: 0.77rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 22px;
      padding: 4px 12px;
      border-radius: 999px;
      transition: color 0.3s ease, background-color 0.3s ease;
    }

    .acoustic-readout.active {
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
    }

    /* Right: Quiet Instrument Console */
    .console {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px 26px 24px;
      gap: 22px;
      background: rgba(13, 16, 20, 0.38);
    }

    .console-block {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .console-block + .console-block {
      padding-top: 18px;
      border-top: 1px solid var(--border-hairline);
    }

    .block-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .block-heading h2 {
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .block-heading span {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Segmented Duration Control */
    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border-hairline);
    }

    .preset-btn {
      min-height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82rem;
    }

    .preset-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }

    /* Sliders */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: rgba(214, 224, 238, 0.14);
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-canvas);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-canvas);
    }

    .slider-val {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-secondary);
      min-width: 48px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Toggles */
    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .toggle-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .toggle-meta span {
      font-size: 0.83rem;
      color: var(--text-primary);
    }

    .toggle-meta small {
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-hairline);
      transition: all 0.25s var(--ease-out);
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: transform 0.25s var(--ease-out), background-color 0.25s ease;
    }

    .toggle-switch input:checked + .toggle-track {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(18px);
      background: var(--accent);
    }

    /* Instrument Chips (live highlight when triggered) */
    .timbre-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .timbre-chip {
      min-height: 28px;
      font-size: 0.73rem;
      font-weight: 400;
      padding: 4px 10px;
      border-radius: 7px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.028);
      border: 1px solid var(--border-hairline);
      transition: all 0.25s var(--ease-out);
    }

    .timbre-chip:hover:not(:disabled) {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.06);
    }

    .timbre-chip.lit {
      color: var(--accent-text);
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    /* Telemetry Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.022);
      border: 1px solid var(--border-hairline);
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.12rem;
      font-weight: 500;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .shortcut-hint {
      font-size: 0.73rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
    }

    kbd {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
    }

    @media (max-width: 820px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .sanctuary {
        border-right: none;
        border-bottom: 1px solid var(--border-hairline);
        padding: 28px 20px 24px;
      }

      .console {
        padding: 22px 20px 22px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 10px 24px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 18px;
      }

      .dial-stage {
        width: 256px;
        height: 256px;
      }

      .time-display {
        font-size: 3rem;
      }

      .stats-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-phase="idle">
  <main class="app-frame">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-title">双随机高效专注计时器</h1>
        <p class="brand-sub">超昼夜节律 (60–90 分钟) · 后台 3–5 分钟随机间隙 · 10 秒神经重放</p>
      </div>
      <div class="phase-pill" id="phaseBadge" aria-live="polite">
        <span class="phase-dot" aria-hidden="true"></span>
        <span id="phaseLabel">待机就绪</span>
      </div>
    </header>

    <div class="workspace">
      <!-- Left: Focal Chronometer Stage -->
      <section class="sanctuary" aria-label="专注计时主视图">
        <div class="dial-stage">
          <div class="aura-ring" aria-hidden="true"></div>
          <svg class="dial-svg" viewBox="0 0 280 280" aria-hidden="true">
            <g class="dial-ticks" id="dialTicks"></g>
            <circle class="ring-track" cx="140" cy="140" r="114"></circle>
            <circle class="ring-progress" id="progressCircle" cx="140" cy="140" r="114"></circle>
          </svg>
          <div class="dial-center">
            <div class="time-display" id="timeDisplay">90:00</div>
            <div class="time-caption" id="timeCaption">超昼夜节律 · 单轮 90 分钟</div>

  <script>
    (function () {
      "use strict";

      /* =====================================================================
         1. Studio-Grade Acoustic Engine (Web Audio API + Procedural Reverb)
         ===================================================================== */
      // Warm, musical pentatonic scale (G3 to E5 — avoiding piercing highs)
      const PENTATONIC_SCALE = [
        { name: "G3", freq: 196.00 },
        { name: "A3", freq: 220.00 },
        { name: "C4", freq: 261.63 },
        { name: "D4", freq: 293.66 },
        { name: "E4", freq: 329.63 },
        { name: "G4", freq: 392.00 },
        { name: "A4", freq: 440.00 },
        { name: "C5", freq: 523.25 },
        { name: "D5", freq: 587.33 },
        { name: "E5", freq: 659.25 }
      ];

      const TIMBRES = [
        { id: "handpan", label: "空灵手碟" },
        { id: "bowl", label: "喜马拉雅颂钵" },
        { id: "kalimba", label: "温润卡林巴" },
        { id: "harp", label: "风铃竖琴" },
        { id: "waterdrop", label: "禅意雨滴" }
      ];

      let audioCtx = null;
      let masterBus = null;
      let dryBus = null;
      let reverbSend = null;
      let lastNoteIndex = -1;
      let lastTimbreIndex = -1;

      function createWarmReverbImpulse(ctx, durationSec, decay) {
        const sampleRate = ctx.sampleRate;
        const length = Math.floor(sampleRate * durationSec);
        const impulse = ctx.createBuffer(2, length, sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const data = impulse.getChannelData(ch);
          let lp = 0;
          for (let i = 0; i < length; i++) {
            const t = i / length;
            // Smooth onset (avoid early harsh reflections) + exponential velvet decay
            const fadeIn = Math.min(1, i / (sampleRate * 0.04));
            const env = fadeIn * Math.pow(1 - t, decay);
            const white = Math.random() * 2 - 1;
            // Simple 1-pole lowpass so the room tail sounds warm like wood/stone
            lp = lp * 0.72 + white * 0.28;
            data[i] = lp * env;
          }
        }
        return impulse;
      }

      function ensureAudioGraph() {
        if (!audioCtx) {
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextCtor) return null;
          audioCtx = new AudioContextCtor();

          // Master chain: Warm lowpass -> Soft Compressor -> Destination
          const masterFilter = audioCtx.createBiquadFilter();
          masterFilter.type = "lowpass";
          masterFilter.frequency.setValueAtTime(5200, audioCtx.currentTime);
          masterFilter.Q.setValueAtTime(0.6, audioCtx.currentTime);

          const compressor = audioCtx.createDynamicsCompressor();
          compressor.threshold.setValueAtTime(-16, audioCtx.currentTime);
          compressor.knee.setValueAtTime(24, audioCtx.currentTime);
          compressor.ratio.setValueAtTime(3.5, audioCtx.currentTime);
          compressor.attack.setValueAtTime(0.015, audioCtx.currentTime);
          compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

          masterBus = audioCtx.createGain();
          masterBus.gain.setValueAtTime(0.95, audioCtx.currentTime);

          masterBus.connect(masterFilter);
          masterFilter.connect(compressor);
          compressor.connect(audioCtx.destination);

          // Dry bus
          dryBus = audioCtx.createGain();
          dryBus.gain.setValueAtTime(0.78, audioCtx.currentTime);
          dryBus.connect(masterBus);

          // Lush stereo reverb bus
          const convolver = audioCtx.createConvolver();
          convolver.buffer = createWarmReverbImpulse(audioCtx, 2.4, 3.2);

          const reverbFilter = audioCtx.createBiquadFilter();
          reverbFilter.type = "lowpass";
          reverbFilter.frequency.setValueAtTime(2600, audioCtx.currentTime);

          reverbSend = audioCtx.createGain();
          reverbSend.gain.setValueAtTime(0.42, audioCtx.currentTime);

          reverbSend.connect(convolver);
          convolver.connect(reverbFilter);
          reverbFilter.connect(masterBus);
        }

        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function pickNonRepeatingIndex(length, lastIdx) {
        if (length <= 1) return 0;
        let idx = Math.floor(Math.random() * length);
        if (idx === lastIdx) {
          idx = (idx + 1 + Math.floor(Math.random() * (length - 1))) % length;
        }
        return idx;
      }

      function createVoiceOut(ctx, panValue, reverbAmt) {
        const out = ctx.createGain();
        out.gain.setValueAtTime(1.0, ctx.currentTime);

        let destinationNode = out;
        if (typeof ctx.createStereoPanner === "function") {
          const panner = ctx.createStereoPanner();
          panner.pan.setValueAtTime(panValue, ctx.currentTime);
          out.connect(panner);
          destinationNode = panner;
        }

        destinationNode.connect(dryBus);
        const wetGain = ctx.createGain();
        wetGain.gain.setValueAtTime(reverbAmt, ctx.currentTime);
        destinationNode.connect(wetGain);
        wetGain.connect(reverbSend);
        return out;
      }

      function schedulePartial(ctx, dest, type, freq, startTime, attack, release, peakGain, freqEnd) {
        const osc = ctx.createOscillator();
        const env = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        if (typeof freqEnd === "number") {
          osc.frequency.exponentialRampToValueAtTime(freqEnd, startTime + attack + 0.18);
        }

        env.gain.setValueAtTime(0.0001, startTime);
        env.gain.linearRampToValueAtTime(Math.max(0.0002, peakGain), startTime + attack);
        env.gain.exponentialRampToValueAtTime(0.0001, startTime + attack + release);

        osc.connect(env);
        env.connect(dest);
        osc.start(startTime);
        osc.stop(startTime + attack + release + 0.12);
      }

      /**
       * Synthesize a lush, organic anti-habituation cue with spatial reverb.
       */
      function playRandomMicroRestCue(baseVolume, isMuted, forcedTimbreId) {
        const noteIdx = pickNonRepeatingIndex(PENTATONIC_SCALE.length, lastNoteIndex);
        let timbreIdx = pickNonRepeatingIndex(TIMBRES.length, lastTimbreIndex);
        if (forcedTimbreId) {
          const foundIdx = TIMBRES.findIndex(function (t) { return t.id === forcedTimbreId; });
          if (foundIdx !== -1) timbreIdx = foundIdx;
        }
        lastNoteIndex = noteIdx;
        lastTimbreIndex = timbreIdx;

        const note = PENTATONIC_SCALE[noteIdx];
        const timbre = TIMBRES[timbreIdx];
        const jitterFactor = randomBetween(0.90, 1.10);
        const jitterPct = Math.round((jitterFactor - 1) * 100);
        const jitterStr = (jitterPct >= 0 ? "+" : "") + jitterPct + "%";

        const meta = {
          noteName: note.name,
          freq: Math.round(note.freq),
          timbreId: timbre.id,
          timbreLabel: timbre.label,
          jitterStr: jitterStr
        };

        if (isMuted) return meta;

        const ctx = ensureAudioGraph();
        if (!ctx) return meta;

        const now = ctx.currentTime + 0.015;
        const gain = Math.min(0.42, Math.max(0.025, baseVolume * 0.34 * jitterFactor));
        const attack = randomBetween(0.036, 0.076); // 36–76ms anti-startle fade-in
        const release = randomBetween(0.95, 1.48); // 0.95–1.48s smooth decay
        const pan = randomBetween(-0.24, 0.24);

        if (timbre.id === "handpan") {
          // Steel tongue / handpan: warm fundamental + octave + fifth with subtle pitch bloom
          const voice = createVoiceOut(ctx, pan, 0.72);
          schedulePartial(ctx, voice, "sine", note.freq * 0.994, now, attack, release * 1.05, gain * 0.72, note.freq);
          schedulePartial(ctx, voice, "sine", note.freq * 2.0, now, attack + 0.01, release * 0.82, gain * 0.28);
          schedulePartial(ctx, voice, "sine", note.freq * 2.997, now, attack + 0.015, release * 0.55, gain * 0.11);
          // Warm low sub-body resonance
          schedulePartial(ctx, voice, "sine", note.freq * 0.5, now, attack + 0.02, release * 0.65, gain * 0.14);
        } else if (timbre.id === "bowl") {
          // Himalayan singing bowl: gentle beating twin + shimmering harmonic halo
          const voice = createVoiceOut(ctx, pan, 0.85);
          schedulePartial(ctx, voice, "sine", note.freq, now, attack + 0.01, release * 1.15, gain * 0.62);
          schedulePartial(ctx, voice, "sine", note.freq + 1.35, now, attack + 0.015, release * 1.1, gain * 0.30);
          schedulePartial(ctx, voice, "sine", note.freq * 2.756, now, attack + 0.025, release * 0.68, gain * 0.10);
          schedulePartial(ctx, voice, "sine", note.freq * 2.0, now, attack + 0.02, release * 0.78, gain * 0.12);
        } else if (timbre.id === "kalimba") {
          // Warm wooden kalimba thumb-piano: filtered triangle + pure fundamental
          const voice = createVoiceOut(ctx, pan, 0.65);
          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(note.freq * 3.6, now);
          filter.frequency.exponentialRampToValueAtTime(note.freq * 1.4, now + release * 0.8);
          filter.Q.setValueAtTime(1.2, now);
          filter.connect(voice);

          schedulePartial(ctx, filter, "triangle", note.freq, now, Math.max(0.032, attack * 0.8), release * 0.92, gain * 0.68);
          schedulePartial(ctx, voice, "sine", note.freq * 2.0, now, attack, release * 0.62, gain * 0.20);
          schedulePartial(ctx, voice, "sine", note.freq * 3.0, now, attack, release * 0.38, gain * 0.06);
        } else if (timbre.id === "harp") {
          // Wind chime / harp harmonic: soft 2-note pentatonic bloom (fundamental + gentle fifth)
          const voice = createVoiceOut(ctx, pan, 0.88);
          schedulePartial(ctx, voice, "sine", note.freq, now, attack, release, gain * 0.56);
          schedulePartial(ctx, voice, "triangle", note.freq * 2.0, now, attack + 0.01, release * 0.65, gain * 0.14);
          // Delicate second chime a perfect fifth above (delayed 110ms)
          const fifthFreq = note.freq * 1.498;
          const voice2 = createVoiceOut(ctx, -pan, 0.92);
          schedulePartial(ctx, voice2, "sine", fifthFreq, now + 0.11, attack + 0.01, release * 0.92, gain * 0.34);
        } else {
          // Zen waterdrop / soft temple woodblock: resonant liquid formant glide
          const voice = createVoiceOut(ctx, pan, 0.78);
          const filter = ctx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(note.freq * 1.1, now);
          filter.frequency.exponentialRampToValueAtTime(note.freq * 1.8, now + 0.16);
          filter.Q.setValueAtTime(2.6, now);
          filter.connect(voice);

          schedulePartial(ctx, filter, "sine", note.freq * 0.92, now, Math.max(0.032, attack * 0.85), release * 0.85, gain * 0.85, note.freq * 1.06);
          schedulePartial(ctx, voice, "sine", note.freq, now, attack, release * 0.9, gain * 0.42);
        }

        return meta;
      }

      /**
       * Ultra-gentle recovery whisper when 10-second micro-rest concludes.
       */
      function playRecoveryCue(baseVolume, isMuted) {
        if (isMuted) return;
        const ctx = ensureAudioGraph();
        if (!ctx) return;

        const now = ctx.currentTime + 0.015;
        const note = PENTATONIC_SCALE[2 + Math.floor(Math.random() * 4)]; // C4–G4 warm register
        const gain = Math.min(0.20, Math.max(0.018, baseVolume * 0.17));
        const voice = createVoiceOut(ctx, 0, 0.75);

        schedulePartial(ctx, voice, "sine", note.freq, now, 0.065, 0.95, gain);
        schedulePartial(ctx, voice, "sine", note.freq * 1.5, now + 0.09, 0.07, 0.85, gain * 0.42);
      }

      /**
       * Warm 4-note resolving pentatonic handpan arpeggio for macro phase completion.
       */
      function playMacroCompleteChime(baseVolume, isMuted) {
        if (isMuted) return;
        const ctx = ensureAudioGraph();
        if (!ctx) return;

        const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
        const baseGain = Math.min(0.28, Math.max(0.025, baseVolume * 0.25));

        notes.forEach(function (freq, idx) {
          const start = ctx.currentTime + 0.03 + idx * 0.42;
          const voice = createVoiceOut(ctx, (idx - 1.5) * 0.18, 0.9);
          schedulePartial(ctx, voice, "sine", freq, start, 0.07, 2.2, baseGain * (1 - idx * 0.1));
          schedulePartial(ctx, voice, "sine", freq * 2.0, start, 0.08, 1.4, baseGain * 0.18);
        });
      }

      /* =====================================================================
         2. Dial Tick Generation (60 precision architectural ticks)
         ===================================================================== */
      function buildDialTicks() {
        const container = document.getElementById("dialTicks");
        if (!container) return;
        const cx = 140;
        const cy = 140;
        const outerR = 128;
        let svgParts = [];

        for (let i = 0; i < 60; i++) {
          const isMajor = i % 5 === 0;
          const innerR = isMajor ? 121 : 124;
          const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
          const x1 = (cx + Math.cos(angle) * innerR).toFixed(2);
          const y1 = (cy + Math.sin(angle) * innerR).toFixed(2);
          const x2 = (cx + Math.cos(angle) * outerR).toFixed(2);
          const y2 = (cy + Math.sin(angle) * outerR).toFixed(2);
          svgParts.push(
            '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
            '" stroke-width="' + (isMajor ? "1.5" : "1") + '"' +
            (isMajor ? ' class="major"' : "") + "></line>"
          );
        }
        container.innerHTML = svgParts.join("");
      }

      /* =====================================================================
         3. State Machine & Dual-Cycle Timing
         ===================================================================== */
      const MICRO_MIN_MS = 180 * 1000; // 3 minutes
      const MICRO_MAX_MS = 300 * 1000; // 5 minutes
      const MICRO_REST_MS = 10 * 1000; // 10 seconds
      const RING_RADIUS = 114;
      const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

      const state = {
        phase: "idle", // "idle" | "focus" | "paused" | "micro_rest" | "macro_done" | "macro_break"
        previousRunningPhase: "focus",
        macroDurationMinutes: 90,
        macroTotalMs: 90 * 60 * 1000,
        macroRemainingMs: 90 * 60 * 1000,
        microRemainingMs: 0, // Strictly hidden from UI
        microRestRemainingMs: MICRO_REST_MS,
        breakTotalMs: 10 * 60 * 1000,
        breakRemainingMs: 10 * 60 * 1000,
        completedMicroRests: 0,
        focusedElapsedMs: 0,
        volume: 0.65,
        muted: false,
        playResumeCue: true,
        lastTimbreId: null,
        lastTickAt: null,
        timerId: null
      };

      /* DOM Elements */
      const bodyEl = document.body;
      const phaseLabelEl = document.getElementById("phaseLabel");
      const progressCircleEl = document.getElementById("progressCircle");
      const timeDisplayEl = document.getElementById("timeDisplay");
      const timeCaptionEl = document.getElementById("timeCaption");
      const microTextEl = document.getElementById("microText");
      const breakPanelEl = document.getElementById("breakPanel");
      const breakSummaryTextEl = document.getElementById("breakSummaryText");
      const startPauseBtn = document.getElementById("startPauseBtn");
      const startPauseTextEl = document.getElementById("startPauseText");
      const startPauseIconEl = document.getElementById("startPauseIcon");
      const resetBtn = document.getElementById("resetBtn");
      const testSoundBtn = document.getElementById("testSoundBtn");
      const startBreak10Btn = document.getElementById("startBreak10Btn");
      const startBreak15Btn = document.getElementById("startBreak15Btn");
      const newSessionBtn = document.getElementById("newSessionBtn");
      const acousticReadoutEl = document.getElementById("acousticReadout");
      const presetButtons = Array.from(document.querySelectorAll(".preset-btn"));
      const timbreChips = Array.from(document.querySelectorAll(".timbre-chip"));
      const durationSlider = document.getElementById("durationSlider");
      const durationValueEl = document.getElementById("durationValue");
      const volumeSlider = document.getElementById("volumeSlider");
      const volumeValueEl = document.getElementById("volumeValue");
      const muteToggle = document.getElementById("muteToggle");
      const resumeCueToggle = document.getElementById("resumeCueToggle");
      const replayCountStatEl = document.getElementById("replayCountStat");
      const focusedMinutesStatEl = document.getElementById("focusedMinutesStat");
      const lastCueStatEl = document.getElementById("lastCueStat");

      progressCircleEl.style.strokeDasharray = String(RING_CIRCUMFERENCE);
      progressCircleEl.style.strokeDashoffset = "0";

      function loadPreferences() {
        try {
          const raw = localStorage.getItem("huberman_dual_random_timer_v1");
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (typeof saved.macroDurationMinutes === "number" && saved.macroDurationMinutes >= 60 && saved.macroDurationMinutes <= 90) {
            state.macroDurationMinutes = Math.round(saved.macroDurationMinutes);
            state.macroTotalMs = state.macroDurationMinutes * 60 * 1000;
            state.macroRemainingMs = state.macroTotalMs;
          }
          if (typeof saved.volume === "number" && saved.volume >= 0.1 && saved.volume <= 1) {
            state.volume = saved.volume;
          }
          if (typeof saved.muted === "boolean") {
            state.muted = saved.muted;
          }
          if (typeof saved.playResumeCue === "boolean") {
            state.playResumeCue = saved.playResumeCue;
          }
        } catch (err) {
          // Ignore storage restrictions
        }
      }

      function savePreferences() {
        try {
          localStorage.setItem("huberman_dual_random_timer_v1", JSON.stringify({
            macroDurationMinutes: state.macroDurationMinutes,
            volume: state.volume,
            muted: state.muted,
            playResumeCue: state.playResumeCue
          }));
        } catch (err) {
          // Ignore storage restrictions
        }
      }

      function generateNextMicroIntervalMs() {
        return Math.round(randomBetween(MICRO_MIN_MS, MICRO_MAX_MS));
      }

      function formatClock(ms) {
        const clamped = Math.max(0, Math.ceil(ms / 1000));
        const mins = Math.floor(clamped / 60);
        const secs = clamped % 60;
        return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
      }

      function setRingProgress(fractionRemaining) {
        const clamped = Math.min(1, Math.max(0, fractionRemaining));
        const offset = RING_CIRCUMFERENCE * (1 - clamped);
        progressCircleEl.style.strokeDashoffset = offset.toFixed(2);
      }

      function highlightTimbre(timbreId) {
        state.lastTimbreId = timbreId;
        timbreChips.forEach(function (chip) {
          chip.classList.toggle("lit", chip.getAttribute("data-timbre") === timbreId);
        });
      }

      function updateAcousticFeedback(meta, contextLabel) {
        const summary = meta.timbreLabel + " · " + meta.noteName + " (" + meta.freq + " Hz) · 音量微扰 " + meta.jitterStr;
        acousticReadoutEl.textContent = (contextLabel ? contextLabel + "：" : "") + summary + (state.muted ? "（已静音）" : "");
        acousticReadoutEl.classList.add("active");
        lastCueStatEl.textContent = meta.noteName + "·" + meta.timbreLabel.slice(-2);
        highlightTimbre(meta.timbreId);
      }

      function stopInterval() {
        if (state.timerId !== null) {
          clearInterval(state.timerId);
          state.timerId = null;
        }
        state.lastTickAt = null;
      }

      function startInterval() {
        stopInterval();
        state.lastTickAt = performance.now();
        state.timerId = setInterval(onTick, 200);
      }

      function onTick() {
        const now = performance.now();
        const deltaMs = Math.max(0, now - (state.lastTickAt || now));
        state.lastTickAt = now;

        if (state.phase === "focus") {
          state.macroRemainingMs = Math.max(0, state.macroRemainingMs - deltaMs);
          state.focusedElapsedMs += deltaMs;

          if (state.macroRemainingMs <= 0) {
            enterMacroDone();
            return;
          }

          state.microRemainingMs -= deltaMs;
          if (state.microRemainingMs <= 0 && state.macroRemainingMs > 15000) {
            enterMicroRest();
            return;
          }
        } else if (state.phase === "micro_rest") {
          state.microRestRemainingMs = Math.max(0, state.microRestRemainingMs - deltaMs);
          state.macroRemainingMs = Math.max(0, state.macroRemainingMs - deltaMs);

          if (state.microRestRemainingMs <= 0) {
            state.completedMicroRests += 1;
            if (state.macroRemainingMs <= 0) {
              enterMacroDone();
              return;
            }
            if (state.playResumeCue) {
              playRecoveryCue(state.volume, state.muted);
              acousticReadoutEl.textContent = "10 秒神经重放完成 · 轻柔恢复专注（下一轮随机周期已启动）";
            } else {
              acousticReadoutEl.textContent = "10 秒神经重放完成 · 静默恢复专注（下一轮随机周期已启动）";
            }
            state.phase = "focus";
            state.microRemainingMs = generateNextMicroIntervalMs();
          }
        } else if (state.phase === "macro_break") {
          state.breakRemainingMs = Math.max(0, state.breakRemainingMs - deltaMs);
          if (state.breakRemainingMs <= 0) {
            stopInterval();
            playRecoveryCue(state.volume, state.muted);
            state.phase = "idle";
            state.macroRemainingMs = state.macroTotalMs;
            acousticReadoutEl.textContent = "大休结束 · 随时可以开启下一轮超昼夜专注";
          }
        }

        render();
      }

      function enterMicroRest() {
        state.phase = "micro_rest";
        state.microRestRemainingMs = MICRO_REST_MS;
        const meta = playRandomMicroRestCue(state.volume, state.muted);
        updateAcousticFeedback(meta, "触发 10 秒微休息");
        render();
      }

      function enterMacroDone() {
        stopInterval();
        state.phase = "macro_done";
        state.macroRemainingMs = 0;
        playMacroCompleteChime(state.volume, state.muted);
        acousticReadoutEl.textContent = "超昼夜周期结束 · 已播放手碟和弦提示，建议大休 10–15 分钟";
        acousticReadoutEl.classList.add("active");
        render();
      }

      function startFocus() {
        ensureAudioGraph();
        if (state.phase === "idle" || state.phase === "macro_done" || state.phase === "macro_break") {
          state.macroTotalMs = state.macroDurationMinutes * 60 * 1000;
          state.macroRemainingMs = state.macroTotalMs;
          state.completedMicroRests = 0;
          state.focusedElapsedMs = 0;
          state.microRemainingMs = generateNextMicroIntervalMs();
          state.phase = "focus";
          acousticReadoutEl.textContent = "专注已开启 · 后台已随机生成 3–5 分钟间隙触发点";
        } else if (state.phase === "paused") {
          state.phase = state.previousRunningPhase;
        }
        startInterval();
        render();
      }

      function pauseTimer() {
        if (state.phase === "focus" || state.phase === "micro_rest" || state.phase === "macro_break") {
          state.previousRunningPhase = state.phase;
          state.phase = "paused";
          stopInterval();
          render();
        }
      }

      function resetTimer() {
        stopInterval();
        state.phase = "idle";
        state.macroTotalMs = state.macroDurationMinutes * 60 * 1000;
        state.macroRemainingMs = state.macroTotalMs;
        state.microRemainingMs = 0;
        state.microRestRemainingMs = MICRO_REST_MS;
        state.completedMicroRests = 0;
        state.focusedElapsedMs = 0;
        acousticReadoutEl.textContent = "实时空间混响合成引擎 · 五声音阶防习惯化就绪";
        acousticReadoutEl.classList.remove("active");
        highlightTimbre(null);
        render();
      }

      function startMacroBreak(minutes) {
        ensureAudioGraph();
        state.breakTotalMs = minutes * 60 * 1000;
        state.breakRemainingMs = state.breakTotalMs;
        state.phase = "macro_break";
        acousticReadoutEl.textContent = "进入 " + minutes + " 分钟大休 · 离开屏幕，让大脑完成离线整合";
        startInterval();
        render();
      }

      function setFocusDuration(minutes) {
        const clamped = Math.min(90, Math.max(60, Math.round(minutes)));
        state.macroDurationMinutes = clamped;
        if (state.phase === "idle" || state.phase === "macro_done") {
          state.macroTotalMs = clamped * 60 * 1000;
          state.macroRemainingMs = state.macroTotalMs;
        }
        savePreferences();
        render();
      }

      function setActionIcon(isPause) {
        if (isPause) {
          startPauseIconEl.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
        } else {
          startPauseIconEl.innerHTML = '<polygon points="7 5 19 12 7 19 7 5"></polygon>';
        }
      }

      /* =====================================================================
         4. UI Render
         ===================================================================== */
      function render() {
        const isLockedDuration = state.phase === "focus" || state.phase === "micro_rest" || state.phase === "paused";

        if (state.phase === "micro_rest") {
          bodyEl.setAttribute("data-phase", "micro_rest");
        } else if (state.phase === "macro_break" || state.phase === "macro_done") {
          bodyEl.setAttribute("data-phase", "macro_break");
        } else if (state.phase === "focus") {
          bodyEl.setAttribute("data-phase", "focus");
        } else {
          bodyEl.setAttribute("data-phase", "idle");
        }

        if (state.phase === "idle") {
          phaseLabelEl.textContent = "待机就绪";
          timeDisplayEl.textContent = formatClock(state.macroRemainingMs);
          timeCaptionEl.textContent = "超昼夜节律 · 单轮 " + state.macroDurationMinutes + " 分钟";
          microTextEl.textContent = "后台随机微休息已隐藏";
          setRingProgress(1);
          startPauseTextEl.textContent = "开始专注";
          setActionIcon(false);
          breakPanelEl.classList.remove("visible");
          document.title = "双随机高效专注计时器";
        } else if (state.phase === "focus") {
          phaseLabelEl.textContent = "深度专注中";
          timeDisplayEl.textContent = formatClock(state.macroRemainingMs);
          timeCaptionEl.textContent = "保持沉浸 · 呼吸光晕运行中";
          microTextEl.textContent = "随机间隙监测中（已隐藏）";
          setRingProgress(state.macroTotalMs > 0 ? state.macroRemainingMs / state.macroTotalMs : 0);
          startPauseTextEl.textContent = "暂停";
          setActionIcon(true);
          breakPanelEl.classList.remove("visible");
          document.title = formatClock(state.macroRemainingMs) + " · 专注中";
        } else if (state.phase === "micro_rest") {
          const secsLeft = Math.max(0, Math.ceil(state.microRestRemainingMs / 1000));
          phaseLabelEl.textContent = "10 秒神经重放";
          timeDisplayEl.textContent = secsLeft + "s";
          timeCaptionEl.textContent = "闭眼静坐 · 停止输入";
          microTextEl.textContent = "宏观剩余 " + formatClock(state.macroRemainingMs);
          setRingProgress(state.microRestRemainingMs / MICRO_REST_MS);
          startPauseTextEl.textContent = "暂停";
          setActionIcon(true);
          breakPanelEl.classList.remove("visible");
          document.title = secsLeft + "s · 闭眼微休息";
        } else if (state.phase === "paused") {
          phaseLabelEl.textContent = "已暂停";
          if (state.previousRunningPhase === "macro_break") {
            timeDisplayEl.textContent = formatClock(state.breakRemainingMs);
            timeCaptionEl.textContent = "大休已暂停";
            setRingProgress(state.breakTotalMs > 0 ? state.breakRemainingMs / state.breakTotalMs : 0);
          } else {
            timeDisplayEl.textContent = formatClock(state.macroRemainingMs);
            timeCaptionEl.textContent = "专注已暂停 · 随机进度已保留";
            setRingProgress(state.macroTotalMs > 0 ? state.macroRemainingMs / state.macroTotalMs : 0);
          }
          microTextEl.textContent = "按空格或点击继续";
          startPauseTextEl.textContent = "继续";
          setActionIcon(false);
          breakPanelEl.classList.remove("visible");
          document.title = "已暂停 · 双随机专注计时器";
        } else if (state.phase === "macro_done") {
          phaseLabelEl.textContent = "本轮已完成";
          timeDisplayEl.textContent = "00:00";
          timeCaptionEl.textContent = "建议大休 10–15 分钟";
          microTextEl.textContent = "共完成 " + state.completedMicroRests + " 次神经重放";
          setRingProgress(0);
          startPauseTextEl.textContent = "开始新一轮";
          setActionIcon(false);
          breakSummaryTextEl.textContent =
            "本轮已完成 " + state.completedMicroRests + " 次「10 秒神经重放（微休息）」。建议离开屏幕，进行 10–15 分钟大休以恢复精力并巩固神经连接。";
          breakPanelEl.classList.add("visible");
          document.title = "专注完成 · 建议大休";
        } else if (state.phase === "macro_break") {
          phaseLabelEl.textContent = "大休恢复中";
          timeDisplayEl.textContent = formatClock(state.breakRemainingMs);
          timeCaptionEl.textContent = "远离屏幕 · 放松双眼";
          microTextEl.textContent = "上轮完成 " + state.completedMicroRests + " 次微休息";
          setRingProgress(state.breakTotalMs > 0 ? state.breakRemainingMs / state.breakTotalMs : 0);
          startPauseTextEl.textContent = "暂停大休";
          setActionIcon(true);
          breakPanelEl.classList.remove("visible");
          document.title = formatClock(state.breakRemainingMs) + " · 大休中";
        }

        presetButtons.forEach(function (btn) {
          const mins = Number(btn.getAttribute("data-minutes"));
          btn.classList.toggle("active", mins === state.macroDurationMinutes);
          btn.disabled = isLockedDuration;
        });

        durationSlider.value = String(state.macroDurationMinutes);
        durationSlider.disabled = isLockedDuration;
        durationValueEl.textContent = state.macroDurationMinutes + " 分钟";

        const volPct = Math.round(state.volume * 100);
        volumeSlider.value = String(volPct);
        volumeValueEl.textContent = state.muted ? "已静音" : volPct + "%";
        muteToggle.checked = state.muted;
        resumeCueToggle.checked = state.playResumeCue;

        replayCountStatEl.textContent = String(state.completedMicroRests);
        focusedMinutesStatEl.textContent = Math.floor(state.focusedElapsedMs / 60000) + "m";

        resetBtn.disabled = state.phase === "idle" && state.completedMicroRests === 0;
        testSoundBtn.disabled = state.phase === "micro_rest";
      }

      /* =====================================================================
         5. Event Listeners
         ===================================================================== */
      startPauseBtn.addEventListener("click", function () {
        if (state.phase === "focus" || state.phase === "micro_rest" || state.phase === "macro_break") {
          pauseTimer();
        } else {
          startFocus();
        }
      });

      resetBtn.addEventListener("click", resetTimer);

      testSoundBtn.addEventListener("click", function () {
        ensureAudioGraph();
        const meta = playRandomMicroRestCue(state.volume, state.muted);
        updateAcousticFeedback(meta, "随机试听");
      });

      timbreChips.forEach(function (chip) {
        chip.addEventListener("click", function () {
          ensureAudioGraph();
          const tId = chip.getAttribute("data-timbre");
          const meta = playRandomMicroRestCue(state.volume, state.muted, tId);
          updateAcousticFeedback(meta, "音色试听");
        });
      });

      startBreak10Btn.addEventListener("click", function () {
        startMacroBreak(10);
      });

      startBreak15Btn.addEventListener("click", function () {
        startMacroBreak(15);
      });

      newSessionBtn.addEventListener("click", function () {
        resetTimer();
        startFocus();
      });

      presetButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setFocusDuration(Number(btn.getAttribute("data-minutes")));
        });
      });

      durationSlider.addEventListener("input", function () {
        setFocusDuration(Number(durationSlider.value));
      });

      volumeSlider.addEventListener("input", function () {
        state.volume = Number(volumeSlider.value) / 100;
        if (state.muted && state.volume > 0) {
          state.muted = false;
        }
        savePreferences();
        render();
      });

      muteToggle.addEventListener("change", function () {
        state.muted = muteToggle.checked;
        savePreferences();
        render();
      });

      resumeCueToggle.addEventListener("change", function () {
        state.playResumeCue = resumeCueToggle.checked;
        savePreferences();
        render();
      });

      document.addEventListener("keydown", function (e) {
        if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
          e.preventDefault();
          startPauseBtn.click();
        }
      });

      buildDialTicks();
      loadPreferences();
      render();
    })();
  </script>
</body>
</html>
